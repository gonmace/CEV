<!-- Modal Exportar a Word -->
<dialog id="exportar-word-servicio-modal" class="modal">
  <div class="modal-box w-11/12 max-w-2xl p-0 overflow-hidden">

    <!-- Header -->
    <div class="bg-primary px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="w-8 h-8 rounded-lg bg-white flex items-center justify-center flex-shrink-0 shadow-sm">
          <i class="fas fa-file-word text-lg text-[#1c7bb0]"></i>
        </span>
        <div>
          <p class="text-[10px] font-bold text-primary-content/60 uppercase tracking-widest">Documento</p>
          <h3 class="text-sm font-bold text-primary-content">Exportar a Word</h3>
        </div>
      </div>
      <button type="button" onclick="document.getElementById('exportar-word-servicio-modal').close()"
              class="w-8 h-8 rounded-lg flex items-center justify-center text-primary-content/60 hover:bg-primary-content/10 transition-colors cursor-pointer">
        <i class="fas fa-times text-sm"></i>
      </button>
    </div>

    <!-- Form -->
    <form id="exportar-word-servicio-form" method="POST" action="{% url 'servicios:exportar_word' servicio.id %}">
      {% csrf_token %}
      <div class="px-6 py-5 flex flex-col gap-4">

        <div>
          <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-1.5">Título</label>
          <input type="text" name="titulo" value="{{ servicio.titulo }}"
                 class="input input-bordered input-sm w-full" required>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-1.5">Solicitante</label>
            <input type="text" name="solicitante" value="{{ servicio.solicitante }}"
                   class="input input-bordered input-sm w-full">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-1.5">Código</label>
            <input type="text" name="codigo" value="{{ servicio.subcategoria_codigo }}"
                   class="input input-bordered input-sm w-full">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-1.5">Ubicación</label>
            <input type="text" name="ubicacion" value=""
                   class="input input-bordered input-sm w-full">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-1.5">Usuario</label>
            <input type="text" name="usuario"
                   value="{{ request.user.get_full_name|default:request.user.username }}"
                   class="input input-bordered input-sm w-full">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-1.5">Revisión</label>
            <input type="text" name="revision" value="1"
                   class="input input-bordered input-sm w-full">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-1.5">Fecha</label>
            <input type="text" name="fecha" value="{{ servicio.fecha_creacion|date:'d/m/Y' }}"
                   class="input input-bordered input-sm w-full">
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-1.5">Tipo de Contrato</label>
          <select id="export-servicio-tipo-contrato" name="tipo_contrato" class="select select-bordered select-sm w-full">
            <option value="CO" selected>Contrato de Obra (CO)</option>
            <option value="SPOT">Compra Spot (SPOT)</option>
            <option value="NCM">Nuevo Contrato Marco (NCM)</option>
            <option value="PFA">Precio Fijo con Ajuste Económico (PFA)</option>
            <option value="PFI">Precio Fijo con Incentivo (PFI)</option>
            <option value="CRF">Costo Reembolsable + Honorario Fijo (CRF)</option>
            <option value="TYM">Tiempo y Materiales (TYM)</option>
            <option value="OTRO">Personalizado…</option>
          </select>
        </div>

        <div id="export-servicio-tipo-contrato-otro-wrap" class="hidden">
          <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-1.5">Especificar tipo de contrato</label>
          <input type="text" id="export-servicio-tipo-contrato-otro" name="tipo_contrato_otro"
                 maxlength="80" placeholder="Nombre del tipo de contrato"
                 class="input input-bordered input-sm w-full">
        </div>

      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-base-200">
        <button type="submit" class="btn btn-success btn-sm">
          <i class="fas fa-download text-xs"></i>
          Exportar
        </button>
      </div>
    </form>

  </div>
  <form method="dialog" class="modal-backdrop"><button>Cerrar</button></form>
</dialog>

<script>
(function () {
  const form = document.getElementById('exportar-word-servicio-form');
  const modal = document.getElementById('exportar-word-servicio-modal');
  const submitBtn = form.querySelector('[type="submit"]');

  const tipoContrato = document.getElementById('export-servicio-tipo-contrato');
  const otroWrap = document.getElementById('export-servicio-tipo-contrato-otro-wrap');
  const otroInput = document.getElementById('export-servicio-tipo-contrato-otro');
  tipoContrato.addEventListener('change', function () {
    const esOtro = tipoContrato.value === 'OTRO';
    otroWrap.classList.toggle('hidden', !esOtro);
    otroInput.required = esOtro;
    if (!esOtro) otroInput.value = '';
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const orig = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="loading loading-spinner loading-xs"></span> Exportando...';
    try {
      const resp = await fetch(form.action, { method: 'POST', body: new FormData(form) });
      if (!resp.ok) throw new Error('Error al exportar');
      const blob = await resp.blob();
      const cd = resp.headers.get('Content-Disposition') || '';
      const match = cd.match(/filename="?([^"]+)"?/);
      const filename = match ? match[1] : 'servicio.docx';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      modal.close();
    } catch {
      if (window.flashy) flashy.error('Error al generar el documento.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = orig;
    }
  });
})();
</script>
