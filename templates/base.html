<!DOCTYPE html>
<html lang="es" data-theme="cev">
<script>
  (function(){var t=localStorage.getItem('cev-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Mi Proyecto{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{% endblock %}">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:title" content="{% block og_title %}{% block title_og %}Mi Proyecto{% endblock %}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{% load static %}{% static 'img/og-default.jpg' %}{% endblock %}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{% endblock %}">

    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}?v={{ css_version }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col">

    {% include 'partials/_impersonate.html' %}
    <div class="flex-1 flex flex-col">
        {% block content %}{% endblock %}
    </div>
    {% include 'partials/_footer.html' %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
